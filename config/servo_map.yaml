# Servo <-> URDF joint map (from UBXRobot3DView.dll disassembly + alpha2.xml).
# Rule used by the PC software 3D view:  rotation_deg = servo_angle_deg + pc_offset   (about the xml <Axis>, relative to the FBX/URDF zero pose).
# URDF:  q_rad = radians(servo_angle_deg + effective_offset);  servo_angle_deg = degrees(q_rad) - effective_offset.
# effective_offset = q_init_deg - pc_init_angle (single source: the calibrated q_init).
# servo_at_q0 = -effective_offset = pc_init_angle - q_init_deg.  q_init = radians(q_init_deg) is the default stance.
# pc_offset is the PC-software reference only; the URDF does not use it directly and has no urdf_offset override.
# Servo travel min/max/home: measured on the robot, from ubtech-open-alpha2 app-core.js SERVO_CALIBRATION (identical to ubtech-open-lynx).
# torque_kgcm / torque_nm = servo stall torque (confirmed). velocity limit in the URDF (5 rad/s) is a placeholder.
