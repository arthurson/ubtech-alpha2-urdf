<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha 2 ONNX policy</title>
<style>
  :root { --bg: #f4f4f8; --panel: #ffffff; --fg: #1d1d27; --mute: #6b6b7b; --line: #d6d6e0; --accent: #6d28d9; --warn: #c2410c; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14141b; --panel: #1d1d27; --fg: #ececf3; --mute: #9a9aae; --line: #34344a; --accent: #a78bfa; --warn: #fb923c; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  #app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
  #stage { position: relative; min-height: 0; }
  #view { width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; width: fit-content; max-width: 100%; }
  button, .btn { font: inherit; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  button:hover:not(:disabled), .btn:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #mjstat { font-size: 12px; color: var(--mute); }
  #mjCmdRow label { display: flex; align-items: center; gap: 3px; }
  #mjCmdRow input[type=range] { width: 84px; margin: 0; }
  #side { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--mute); margin: 0 0 10px; font-size: 12px; }
  #mjbox { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin: 0 0 8px; }
  #side details { border-color: var(--line) !important; }
  #side input, #side select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
  #side a { color: var(--accent); }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: 55vh minmax(0, 1fr); } #side { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="hud">
      <div class="bar">
        <button id="langBtn" onclick="toggleLang()">EN</button>
        <button id="polBtn" class="primary" onclick="MJSIM.play(!MJSIM.pol.on)" disabled>▶ 開始</button>
        <button onclick="MJSIM.reset()" data-i18n="p_reset" data-i18n-title="p_reset_t">重置</button>
        <button onclick="MJSIM.push()" data-i18n="p_push" data-i18n-title="p_push_t">推</button>
        <span id="mjstat" class="mono"></span>
      </div>
      <div id="mjCmdRow" class="bar" style="display:none" data-i18n-title="mj_cmd_t"><b data-i18n="mj_cmd">速度</b>
        <label>vx<input type="range" id="mjCvx" min="-0.03" max="0.03" step="0.0015" value="0" oninput="MJSIM.cmdUI()"><b id="mjCvxV" class="mono">0.00</b></label>
        <label>vy<input type="range" id="mjCvy" min="-0.02" max="0.02" step="0.001" value="0" oninput="MJSIM.cmdUI()"><b id="mjCvyV" class="mono">0.00</b></label>
        <label>wz<input type="range" id="mjCwz" min="-0.3" max="0.3" step="0.015" value="0" oninput="MJSIM.cmdUI()"><b id="mjCwzV" class="mono">0.00</b></label>
        <button onclick="MJSIM.setCmd(0,0,0)">0</button>
        <span style="color:var(--mute);font-size:11px" data-i18n="p_hint"></span>
      </div>
    </div>
  </div>
  <aside id="side">
    <h1 data-i18n="p_title">ONNX policy 訓練同試行</h1>
    <p class="sub" data-i18n="p_sub"></p>
    <div id="mjbox">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <b data-i18n="p_file">載入檔案</b>
        <input type="file" id="polFile" accept=".onnx,.json" multiple data-i18n-title="p_file_t" style="flex:1;min-width:0;font-size:11px" onchange="MJSIM.loadPolicy(this.files)">
      </div>
    </div>
    <!-- rl-cloud.js mounts the GitHub Actions training panel (task, options, run status, policy list) right after #mjbox -->
  </aside>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/OBJLoader.js"></script>
<script src="fk-params.js?v=20261101"></script>
<script src="policy-sim.js?v=20261104d"></script>
<script src="rl-cloud.js?v=20261104"></script>
</body>
</html>
