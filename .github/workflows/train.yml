name: train-rl
# Manual run: Actions tab -> train-rl -> Run workflow. CPU only (standard GitHub runners have no GPU).
on:
  workflow_dispatch:
    inputs:
      minutes: {description: 'Training wall-clock budget (job limit is 360 min)', default: '300'}
      resume:  {description: 'Resume from the latest cached checkpoint (true/false)', default: 'true'}
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: rl/requirements.txt}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r rl/requirements.txt
      - name: Restore latest checkpoint
        if: inputs.resume == 'true'
        uses: actions/cache/restore@v4
        with: {path: rl/out, key: rl-ckpt-none, restore-keys: 'rl-ckpt-'}
      - name: Train
        run: python rl/train.py --minutes ${{ inputs.minutes }} --out rl/out --resume rl/out/model.zip
      - name: Save checkpoint for the next run
        if: always()
        uses: actions/cache/save@v4
        with: {path: rl/out, key: 'rl-ckpt-${{ github.run_id }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: alpha2-policy, path: rl/out/}
