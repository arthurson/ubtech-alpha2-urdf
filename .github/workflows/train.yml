name: train-rl
# Run from the Actions tab, or from the web player (cloud-training panel -> workflow_dispatch API).
# CPU only (standard GitHub runners have no GPU). The finished policy is also pushed to the `policies` branch
# (policies/<task>/<name>/{policy.onnx,ref.json,meta.json,curve.json} + policies/index.json) so the web player can load it from raw.githubusercontent.com.
on:
  workflow_dispatch:
    inputs:
      minutes: {description: 'Training wall-clock budget in minutes, 1-340 (a GitHub job is limited to 360 min including setup; 330 is the safe maximum)', default: '330'}
      task:    {description: 'stand (balance), walk (velocity walk: forward / back / left / right / turn on command), walk_ref (imitate the official forward walk), getup_back (get up from lying on the back / face up = official BackStand) or getup_front (from lying on the front / face down = FrontStand)', type: choice, options: [walk, walk_ref, stand, getup_back, getup_front], default: 'walk'}
      resume:  {description: 'Resume from the latest cached checkpoint (true/false)', default: 'true'}
      seed:    {description: 'Random seed', default: '0'}
      cfg:     {description: 'JSON overrides for push / reward weights, see CFG in rl/alpha2_env.py', default: '{}'}
      name:    {description: 'Name to keep this policy under (letters, digits, - _ ; empty = auto). Same task+name overwrites.', default: ''}
permissions:
  contents: write   # push the result to the `policies` branch
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # inputs go through env vars (never interpolated into the shell script)
      TASK: ${{ inputs.task }}
      MINUTES: ${{ inputs.minutes }}
      SEED: ${{ inputs.seed }}
      ALPHA2_CFG: ${{ inputs.cfg }}
      POLICY_NAME: ${{ inputs.name }}
    steps:
      - name: Validate inputs
        run: |
          case "$TASK" in stand|walk|walk_ref|getup_back|getup_front) ;; *) echo "task must be stand, walk, walk_ref, getup_back or getup_front"; exit 1;; esac
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && [ "$MINUTES" -ge 1 ] && [ "$MINUTES" -le 340 ] || { echo "minutes must be 1..340"; exit 1; }
          [[ "$SEED" =~ ^[0-9]+$ ]] || { echo "seed must be a non-negative integer"; exit 1; }
          [[ -z "$POLICY_NAME" || ( "$POLICY_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$ && "$POLICY_NAME" != legacy ) ]] || { echo "name must be letters/digits/-/_ (max 32), not 'legacy'"; exit 1; }
          echo "$ALPHA2_CFG" | jq -e 'type == "object"' >/dev/null || { echo "cfg must be a JSON object"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: rl/requirements.txt}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r rl/requirements.txt
      - name: Restore latest checkpoint
        if: inputs.resume == 'true'
        uses: actions/cache/restore@v4
        with: {path: rl/out, key: 'rl-ckpt-v2-${{ inputs.task }}-none', restore-keys: 'rl-ckpt-v2-${{ inputs.task }}-'}
      - name: Train
        run: python rl/train.py --task "$TASK" --minutes "$MINUTES" --seed "$SEED" --out rl/out --resume rl/out/model.zip
      - name: Save checkpoint for the next run
        if: always()
        uses: actions/cache/save@v4
        with: {path: rl/out, key: 'rl-ckpt-v2-${{ inputs.task }}-${{ github.run_id }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: alpha2-policy, path: rl/out/}
      - name: Publish to the policies branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # each attempt starts from a fresh clone, so two runs finishing together never produce an index.json merge conflict
          for i in 1 2 3 4; do
            rm -rf /tmp/pol
            if git ls-remote --exit-code --heads "$URL" policies >/dev/null 2>&1; then
              git clone -q --depth 1 --branch policies "$URL" /tmp/pol
            else
              git init -q -b policies /tmp/pol && git -C /tmp/pol remote add origin "$URL"
            fi
            python rl/publish.py --dest /tmp/pol --out rl/out --task "$TASK" --name "$POLICY_NAME" \
              --run-id "$GITHUB_RUN_ID" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --minutes "$MINUTES"
            git -C /tmp/pol config user.name "github-actions[bot]"; git -C /tmp/pol config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C /tmp/pol add -A
            git -C /tmp/pol diff --cached --quiet || git -C /tmp/pol commit -q -m "policy: $TASK ${POLICY_NAME:-auto} (run $GITHUB_RUN_ID)"
            if git -C /tmp/pol push -q origin policies; then exit 0; fi
            sleep 5
          done
          echo "push to policies failed"; exit 1
