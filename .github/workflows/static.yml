name: pages
on:
  push:
    branches: [main, master]
    paths: [web/**, .github/workflows/static.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # 整個 repo（mesh 要跟埋，ubx-player.html 經 ../meshes 讀 OBJ）
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
